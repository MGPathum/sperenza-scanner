<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPERENZA '26 | Live Gate Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
      margin: 0; padding: 16px; background: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { margin: 0; font-size: 22px; color: #f87171; letter-spacing: 1px; }
    .header p { margin: 4px 0 0; font-size: 13px; color: #94a3b8; }
    .card {
      width: 100%; max-width: 420px; background: #1e293b;
      border-radius: 16px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
    .manual-box { display: flex; gap: 8px; margin-top: 14px; }
    .manual-box input {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155;
      background: #0f172a; color: #fff; font-size: 15px; text-transform: uppercase;
    }
    .manual-box button, .btn-next {
      padding: 12px 18px; border: none; border-radius: 10px;
      background: #3b82f6; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    .btn-next { width: 100%; margin-top: 14px; background: #f8fafc; color: #0f172a; }
    #result { display: none; margin-top: 16px; padding: 18px; border-radius: 12px; text-align: center; }
    .res-valid { background: #064e3b; border: 2px solid #10b981; }
    .res-duplicate { background: #7f1d1d; border: 2px solid #ef4444; }
    .res-error { background: #7c2d12; border: 2px solid #f97316; }
    .res-title { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
    .res-msg { font-size: 14px; opacity: 0.9; margin: 0 0 12px; }
    .details {
      text-align: left; background: rgba(0,0,0,0.25); padding: 12px;
      border-radius: 8px; font-size: 14px; line-height: 1.6;
    }
    #loading { display: none; text-align: center; padding: 20px; color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎄 SPERENZA '26</h1>
    <p>Live Auto-Detect Gate Scanner</p>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div id="loading">⏳ Verifying Ticket...</div>
    <div id="result"></div>

    <div class="manual-box">
      <input type="text" id="manualId" placeholder="Manual ID (e.g. SP26-001)">
      <button onclick="manualCheck()">Check</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw4j8aItD4NvuyHr2tFu5lW0XEETv9DXV78mAc_GRGbLIN0neYAi7ArQebGPtrGB5Y/exec";

    let html5QrCode;
    let isProcessing = false;

    function startScanner() {
      document.getElementById("result").style.display = "none";
      document.getElementById("reader").style.display = "block";
      isProcessing = false;

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 12, qrbox: { width: 240, height: 240 } },
        (decodedText) => {
          if (!isProcessing) {
            isProcessing = true;
            html5QrCode.stop().then(() => checkTicket(decodedText));
          }
        },
        () => {}
      ).catch(err => {
        document.getElementById("reader").innerHTML =
          "<p style='padding:20px;text-align:center;color:#f87171;'>Camera access allow කරලා page එක refresh කරන්න.</p>";
      });
    }

    function manualCheck() {
      const id = document.getElementById("manualId").value.trim();
      if (!id) return;
      isProcessing = true;
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => checkTicket(id));
      } else {
        checkTicket(id);
      }
    }

    async function checkTicket(ticketId) {
      document.getElementById("reader").style.display = "none";
      document.getElementById("result").style.display = "none";
      document.getElementById("loading").style.display = "block";

      try {
        const response = await fetch(`${API_URL}?id=${encodeURIComponent(ticketId)}`);
        const res = await response.json();
        showResult(res);
      } catch (err) {
        showResult({ status: "error", title: "CONNECTION ERROR", message: "Internet check කරලා ආයෙ බලන්න." });
      }
    }

    function showResult(res) {
      document.getElementById("loading").style.display = "none";
      const box = document.getElementById("result");
      box.className = res.status === "valid" ? "res-valid" : (res.status === "duplicate" ? "res-duplicate" : "res-error");

      let icon = res.status === "valid" ? "✅" : (res.status === "duplicate" ? "🚫" : "❌");
      let detailsHtml = "";

      if (res.name) {
        detailsHtml = `
          <div class="details">
            <div><strong>ID:</strong> ${res.ticketId || "-"}</div>
            <div><strong>Name:</strong> ${res.name}</div>
            ${res.nic ? `<div><strong>NIC:</strong> ${res.nic}</div>` : ""}
            ${res.ticketType ? `<div><strong>Ticket:</strong> ${res.ticketType}</div>` : ""}
            ${res.branch ? `<div><strong>Branch:</strong> ${res.branch}</div>` : ""}
          </div>
        `;
      }

      box.innerHTML = `
        <div class="res-title">${icon} ${res.title}</div>
        <div class="res-msg">${res.message}</div>
        ${detailsHtml}
        <button class="btn-next" onclick="startScanner()">📷 Scan Next Ticket</button>
      `;
      box.style.display = "block";
      document.getElementById("manualId").value = "";
    }

    window.onload = startScanner;
  </script>
</body>
</html>
